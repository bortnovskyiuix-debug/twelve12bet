<!DOCTYPE html>
<html lang="en" data-brand="12bet">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#050C17"/>
<title>12xBet Poker — Lobby</title>
<link rel="icon" href="brand/12bet/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="brand/12bet/apple-touch-icon.png"/>
<link rel="preload" as="image" href="brand/12bet/logo.svg"/>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
@font-face{font-family:Montserrat;font-weight:400;font-display:swap;src:url(fonts/montserrat-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:500;font-display:swap;src:url(fonts/montserrat-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:600;font-display:swap;src:url(fonts/montserrat-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}

:root{
  --bg:#070F1C; --panel:#0C1829; --panel-2:#111F34; --panel-3:#172840; --panel-4:#1E3250;
  --line:#1A2A41; --line-2:#263A58;
  --text:#F2F5F9; --text-2:#C3CEDC; --mute:#7E8FA6; --dim:#55667D;
  --blue:#0098FE; --blue-h:#1FA5FF; --blue-d:#0B6FD1; --blue-soft:rgba(0,152,254,.12);
  --gold:#E9C987; --green:#2FCB7A; --red:#E8475B;
  --felt-0:#16527C; --felt-1:#0F3A5C; --felt-2:#0B2A44;
  --r:12px; --rs:8px;
  --side:248px; --head:68px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px); --tg-t:0px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;flex:none}
.hide{display:none!important}

/* ── Header ─────────────────────────────── */
.hdr{position:sticky;top:0;z-index:40;height:var(--head);display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.sq{width:40px;height:40px;border-radius:var(--rs);display:grid;place-items:center;background:transparent;color:var(--text-2);position:relative}
.sq:hover{background:var(--panel-3);color:var(--text)}
.sq.lang{width:auto;padding:0 12px;gap:8px;display:flex;font-weight:600;font-size:13px}
.sq .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 2px var(--panel)}
.logo{display:block;margin:0 10px 0 4px}
.logo img{height:24px;display:block}
.sp{flex:1}
.user{display:flex;align-items:center;gap:10px;margin-right:4px}
.user img{width:40px;height:40px;border-radius:50%;background:#1B3550}
.user div{display:grid;line-height:1.3}
.user b{font-size:13px;font-weight:600}
.user small{font-size:11.5px;color:var(--mute)}
.bal{display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 12px;border-radius:var(--rs);background:var(--panel-2)}
.coin{width:20px;height:20px;border-radius:50%;background:var(--gold);display:grid;place-items:center;color:#4A3610;font-weight:700;font-size:11px}
.bal b{font-size:14px;font-weight:600;min-width:64px}
.bal .chev{color:var(--mute);margin-right:2px}
.plus{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#fff;background:var(--blue)}
.plus:hover{background:var(--blue-h)}

/* ── Shell ──────────────────────────────── */
.shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:calc(100vh - var(--head))}
.side{position:sticky;top:var(--head);height:calc(100vh - var(--head));overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-right:1px solid var(--line)}
.grp{display:grid;gap:2px;padding:0}
.grp+.grp{margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.grp a{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:var(--rs);color:var(--text-2);font-weight:500;font-size:13.5px}
.grp a:hover{background:var(--panel-3);color:var(--text)}
.grp a svg{color:var(--mute)}
.grp a.on{background:var(--blue-soft);color:var(--blue)}
.grp a.on svg{color:var(--blue)}
.grp a .soon{margin-left:auto;font-size:10.5px;color:var(--dim)}
.app-card{margin-top:auto;padding:14px;border-radius:var(--r);background:var(--panel-2);border:1px solid var(--line)}
.app-card b{display:block;font-size:13px;margin-bottom:4px}
.app-card small{color:var(--mute);font-size:12px;line-height:1.45;display:block;margin-bottom:10px}
.main{min-width:0;padding:12px 28px 56px}
.view{max-width:1480px;margin:0 auto;display:grid;gap:22px}

/* ── Common ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--rs);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn-blue{color:#fff;background:var(--blue)}
.btn-blue:hover{background:var(--blue-h)}
.btn-dark{background:var(--panel-3);color:var(--text)}
.btn-dark:hover{background:var(--panel-4)}
.ibtn{width:38px;height:38px;border-radius:var(--rs);display:grid;place-items:center;background:var(--panel-3);color:var(--text-2)}
.ibtn:hover{background:var(--panel-4);color:var(--text)}
.sec-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:18px;font-weight:600}
.welcome h1{margin:0;font-size:20px;font-weight:600}
.welcome p{margin:4px 0 0;color:var(--mute);font-size:13px}
.welcome p b{color:var(--green);font-weight:600}
.ev{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-2);font-size:13px}

/* Carousel */
.car{position:relative}
.car-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc(50% - 7px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:var(--r)}
.car-track::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start;aspect-ratio:2.85/1;border-radius:var(--r);overflow:hidden;background:var(--panel);display:block;position:relative}
.slide img{width:100%;height:100%;object-fit:cover;display:block}
.car-arrow{position:absolute;top:50%;translate:0 -50%;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(12,24,41,.85);color:#fff;z-index:2}
.car-arrow.l{left:10px}.car-arrow.r{right:10px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--dim);transition:width .25s;cursor:pointer}
.dots i.on{width:36px;background:var(--text-2)}

/* Tournament cards */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tcard{border-radius:var(--r);overflow:hidden;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.tcard:hover{border-color:var(--line-2)}
.tart{position:relative;aspect-ratio:1.85/1;overflow:hidden;background:#0A1526}
.tart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,right center)}
.tart{--tint:#0C1F3A}.tart.gold{--tint:#2A2414}.tart.free{--tint:#0E2F2A}
.tart::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tint) 30%,color-mix(in srgb,var(--tint) 45%,transparent) 62%,transparent 85%)}
.tart>*:not(img){z-index:1}
.cd{position:absolute;top:10px;right:10px;padding:5px 9px;border-radius:6px;background:rgba(7,15,28,.78);font-size:12px;color:var(--text-2)}
.cd b{color:var(--text);font-weight:600;margin-left:4px}
.cd.live b{color:var(--green)}
.tart .kind{display:none}
.tart .gtd{position:absolute;left:14px;bottom:12px;display:grid;line-height:1.1}
.tart .gtd small{font-size:11.5px;color:var(--text-2);margin-bottom:3px}
.tart .gtd b{font-size:26px;font-weight:700;color:var(--gold)}
.tbody{padding:12px 14px 14px;display:grid;gap:7px}
.tbody h3{margin:0 0 2px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12.5px}
.kv svg{width:16px;height:16px;color:var(--dim)}
.kv .v{margin-left:auto;color:var(--text);font-weight:600}
.kv .v.g{color:var(--gold)}

/* Notice + jackpot strip */
.notice{display:flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--line);color:var(--text-2);font-size:13px;overflow:hidden}
.notice svg{color:var(--green);flex:none;width:16px;height:16px}
.notice span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .3s}
.notice span.out{opacity:0}
.notice em{font-style:normal;color:var(--blue);font-weight:600}
.notice strong{color:var(--text);font-weight:600}
.jstrip{position:relative;height:112px;border-radius:var(--r);overflow:hidden;background:#0C2242;display:flex;align-items:center;padding:0 28px;gap:16px}
.jstrip img{position:absolute;right:56px;bottom:-62%;height:190%;width:auto}
.jstrip::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0C2242 36%,rgba(12,34,66,0) 62%)}
.jstrip .t{position:relative;z-index:1;display:grid;line-height:1.1}
.jstrip .t small{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.02em;margin-bottom:4px}
.jstrip .t b{font-size:34px;font-weight:700;color:var(--gold)}
.jstrip .t i{display:none}

/* Filters row */
.frow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2)}
.tabs button{height:38px;padding:0 20px;border-radius:6px;color:var(--mute);font-weight:600;font-size:14px}
.tabs button:hover{color:var(--text)}
.tabs button.on{background:var(--panel-4);color:var(--text)}
.chk{white-space:nowrap;display:flex;align-items:center;gap:9px;height:44px;padding:0 14px;border-radius:var(--rs);background:var(--panel-2);color:var(--text-2);font-size:13px;cursor:pointer;user-select:none}
.chk input{appearance:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);margin:0;display:grid;place-items:center;cursor:pointer}
.chk input:checked{border-color:var(--blue);background:radial-gradient(circle,var(--blue) 42%,transparent 48%)}
.vt{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2)}
.vt button{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;color:var(--mute)}
.vt button.on{background:var(--panel-4);color:var(--text)}

/* Stake section */
.stake{display:grid;gap:12px}
.stake-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stake-h h3{margin:0;font-size:17px;font-weight:600}
.stake-h .meta{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
.stake-h .meta b{color:var(--text-2);font-weight:600}
.stake-h .meta i{width:1px;height:14px;background:var(--line-2)}
.stake-h .meta svg{width:16px;height:16px}
.tables{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 28px) / 3);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.tables::-webkit-scrollbar{display:none}
.tables.grid{grid-auto-flow:row;grid-template-columns:repeat(3,1fr);overflow:visible}

/* Mini table card */
.mt{scroll-snap-align:start;position:relative;aspect-ratio:1.4/1;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);overflow:hidden;cursor:pointer}
.mt:hover{border-color:var(--line-2)}
.mt .oval{position:absolute;left:14%;right:14%;top:27%;bottom:13%;border-radius:999px;background:radial-gradient(ellipse 70% 60% at 50% 45%,var(--felt-0),var(--felt-1) 55%,var(--felt-2));box-shadow:0 0 0 6px #132C47,0 0 0 7px #0A1526}
.mt .ctr{position:absolute;left:50%;top:61%;translate:-50% -50%;text-align:center;line-height:1.15;pointer-events:none}
.mt .ctr b{display:block;font-size:15px;font-weight:600}
.mt .ctr small{display:block;font-size:10.5px;color:rgba(195,206,220,.55);margin:1px 0}
.mt .ctr strong{display:block;font-size:17px;font-weight:700}
.cnt{position:absolute;left:10px;top:10px;height:28px;min-width:50px;padding:0 10px;border-radius:6px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--panel-3);color:var(--text-2)}
.cnt.part{background:linear-gradient(90deg,var(--green) 0 6px,var(--panel-3) 6px);padding-left:14px}
.cnt.full{background:var(--red);color:#fff}
.jpb{position:absolute;left:50%;top:10px;translate:-50% 0;height:28px;padding:0 10px;border-radius:6px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--gold);background:rgba(233,201,135,.1)}
.jpb svg{width:14px;height:14px}
.shield{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--panel-3);color:var(--mute)}
.shield svg{width:15px;height:15px}
.seat{position:absolute;translate:-50% -50%;display:grid;justify-items:center;gap:2px;width:84px}
.seat .nm{font-size:10.5px;font-weight:500;color:var(--text-2);max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .av{width:38px;height:38px;border-radius:50%;background:#1B3550;box-shadow:0 0 0 2px #0A1526;overflow:hidden;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff}
.seat .av img{width:100%;height:100%;display:block}
.seat .stk{margin-top:-8px;padding:1px 7px;border-radius:99px;background:#0A1526;font-size:10.5px;font-weight:600;position:relative}
.seat .mvp{position:absolute;top:10px;right:6px;font-size:8.5px;font-weight:700;color:#3A2A08;background:var(--gold);border-radius:3px;padding:1px 4px}
.seat.empty .av{background:transparent;box-shadow:none;border:1.5px dashed rgba(195,206,220,.25);color:rgba(195,206,220,.45);font-size:18px;font-weight:400}
.seat.empty .nm{visibility:hidden}
.s0{left:32%;top:33%}.s1{left:68%;top:33%}.s2{left:11%;top:59%}.s3{left:89%;top:59%}.s4{left:32%;top:86%}.s5{left:68%;top:86%}
/* list mode */
.tlist{display:grid;gap:6px}
.lr{display:grid;grid-template-columns:100px 1fr 1fr 1fr 1fr 110px;align-items:center;gap:12px;height:58px;padding:0 16px;border-radius:var(--rs);background:var(--panel);border:1px solid var(--line)}
.lr .cnt{position:static}
.lr b{font-weight:600}
.lr .jp{color:var(--gold);font-weight:600}
.lr .m{color:var(--mute)}

/* Spin & Go */
.sbox{padding:18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);display:grid;gap:16px}
.sbox .sec-h a{margin-left:auto;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.subtabs{display:flex;gap:2px;padding:3px;border-radius:var(--rs);background:var(--panel-2);width:max-content}
.subtabs button{height:36px;padding:0 14px;border-radius:6px;color:var(--mute);font-weight:600;font-size:13px}
.subtabs button.on{background:var(--panel-4);color:var(--text)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.scard{position:relative;aspect-ratio:1.7/1;border-radius:var(--r);overflow:hidden;background:var(--panel-2);display:block}
.scard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--pos,100% 50%)}
.scard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--tint) 34%,color-mix(in srgb,var(--tint) 55%,transparent) 58%,transparent 80%)}
.scard.t1{--tint:#0E2A4A}.scard.t2{--tint:#0B3A6E}.scard.t3{--tint:#2A2414}
.scard>*:not(img){position:absolute;z-index:1}
.scard .bi{left:14px;top:14px;padding:6px 9px;border-radius:6px;background:rgba(7,15,28,.6);line-height:1.2}
.scard .bi small{display:block;font-size:11px;color:var(--text-2)}
.scard .bi b{font-size:16px;font-weight:700}
.scard .win{left:14px;top:46%;line-height:1.05}
.scard .win small{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.scard .win b{font-size:28px;font-weight:700;color:var(--gold)}
.scard .ft{left:14px;bottom:12px;font-size:12.5px;color:var(--text-2);display:flex;gap:8px;align-items:center}

/* Drawer + tabbar (phones) */
.tabbar,.drawer-bg{display:none}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--safe-b));translate:-50% 20px;opacity:0;pointer-events:none;padding:11px 16px;border-radius:var(--rs);background:var(--panel-4);font-size:13px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .25s,translate .25s;z-index:80}
.toast.on{opacity:1;translate:-50% 0}

@media (max-width:1280px){
  .tgrid{grid-template-columns:repeat(3,1fr)}
  .tgrid .tcard:nth-child(n+4){display:none}
  .tables{grid-auto-columns:calc((100% - 14px) / 2)}
  .tables.grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:980px){ .hdr .reg{display:none} }
@media (max-width:860px){
  :root{--head:calc(56px + var(--safe-t) + var(--tg-t))}
  .hdr{height:var(--head);padding:calc(var(--safe-t) + var(--tg-t)) 10px 0;gap:6px}
  .hdr .btn{height:34px;padding:0 12px;font-size:12.5px}
  .sq{width:36px;height:36px}
  .logo{margin:0 2px}
  .logo img{height:17px}
  .user img{width:32px;height:32px}
  .bal{height:36px;gap:6px;padding:0 3px 0 8px}
  .bal b{min-width:0;font-size:13px}
  .bal .chev{display:none}
  .coin{width:16px;height:16px;font-size:9px}
  .plus{width:28px;height:28px}
  .shell{display:block}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:70;width:272px;height:auto;translate:-100% 0;transition:translate .25s ease;padding-top:calc(14px + var(--safe-t) + var(--tg-t))}
  body.drawer .side{translate:0 0}
  .drawer-bg{display:block;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
  body.drawer .drawer-bg{opacity:1;pointer-events:auto}
  .main{padding:14px 12px calc(90px + var(--safe-b))}
  .view{gap:18px}
  .welcome h1{font-size:18px}
  .ev{display:none}
  .car-track{grid-auto-columns:100%}
  .car-arrow{display:none}
  .tgrid{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:78%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .tgrid::-webkit-scrollbar{display:none}
  .tgrid .tcard{scroll-snap-align:center}
  .tgrid .tcard:nth-child(n+4){display:flex}
  .tgrid.all{grid-auto-flow:row;grid-template-columns:1fr;grid-auto-columns:auto;overflow:visible;margin:0;padding:0}
  .sec-h h2{font-size:16px}
  .jstrip{height:84px;padding:0 16px}
  .jstrip img{right:4px;bottom:-48%;height:160%}
  .jstrip .t small{font-size:11.5px}
  .jstrip .t b{font-size:22px}
  .frow{gap:8px}
  .tabs{width:100%}
  .tabs button{flex:1;padding:0;height:36px;font-size:13px}
  .chk{height:40px;padding:0 12px;font-size:12.5px;flex:1}
  .vt{display:none}
  .chk .lg,.stake-h .meta .bl{display:none}
  .notice{height:40px;font-size:12px;justify-content:flex-start}
  .stake-h h3{font-size:16px}
  .stake-h .meta{order:3;width:100%;font-size:12.5px}
  .stake-h .sp{display:none}
  .stake-h .nav{margin-left:auto}
  .stake-h .nav .ibtn:not(.rf){display:none}
  .stake-h .va{display:none}
  .tables{grid-auto-columns:88%;margin:0 -12px;padding:0 12px}
  .tables.grid{grid-template-columns:1fr;margin:0;padding:0}
  .seat{width:70px}
  .seat .av{width:34px;height:34px}
  .lr{grid-template-columns:72px 1fr 1fr 96px;height:auto;padding:12px}
  .lr .h1,.lr .h2{display:none}
  .sbox{padding:12px}
  .sgrid{grid-template-columns:1fr 1fr;gap:10px}
  .scard{aspect-ratio:1/1.05}
  .scard::after{background:linear-gradient(0deg,var(--tint) 40%,color-mix(in srgb,var(--tint) 55%,transparent) 62%,transparent 85%)}
  .scard img{object-position:70% 0}
  .scard .win{top:auto;bottom:36px}
  .scard .win small{font-size:11px}
  .scard .win b{font-size:21px}
  .scard .bi b{font-size:14px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;padding:6px 6px calc(6px + var(--safe-b));background:var(--panel);border-top:1px solid var(--line)}
  .tabbar a{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--mute);font-size:10.5px;font-weight:600}
  .tabbar a.on{color:var(--blue)}
}
@media (max-width:380px){ .user img{display:none} }
</style>

  <a href="#holdem" data-v="holdem"><svg class="i"><use href="#i-cards"/></svg>Hold'em</a>
  <a href="#spin" data-v="spin"><svg class="i"><use href="#i-spin"/></svg>Spin &amp; Go</a>
  <a href="#tours" data-v="tours"><svg class="i"><use href="#i-cup"/></svg>Tournaments</a>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  /* ── Telegram ─────────────────────── */
  var TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData !== undefined ? window.Telegram.WebApp : null;
  if (TG) {
    try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); if (TG.requestFullscreen && /android|iphone|ipad/i.test(navigator.userAgent)) TG.requestFullscreen(); } catch(e){}
    try { TG.setHeaderColor && TG.setHeaderColor('#050C17'); TG.setBackgroundColor && TG.setBackgroundColor('#050C17'); } catch(e){}
    var setTop = function(){ var a=(TG.safeAreaInset&&TG.safeAreaInset.top)||0, b=(TG.contentSafeAreaInset&&TG.contentSafeAreaInset.top)||0; document.documentElement.style.setProperty('--tg-t',(a+b)+'px'); };
    setTop(); try { TG.onEvent('safeAreaChanged',setTop); TG.onEvent('contentSafeAreaChanged',setTop); } catch(e){}
  }
  var haptic = function(k){ try { TG && TG.HapticFeedback && TG.HapticFeedback.impactOccurred(k||'light'); } catch(e){} };

  /* ── helpers ─────────────────────── */
  var $ = function(s,r){ return (r||document).querySelector(s); };
  var fmt = function(n,d){ return n.toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); };
  var usd = function(n){ return '$' + (n < 10 && n % 1 ? n.toFixed(2).replace(/0$/,'') : fmt(n, n % 1 ? 2 : 0)); };
  var seed = 1207, rnd = function(){ seed = (seed*16807)%2147483647; return (seed-1)/2147483646; };
  var pick = function(a){ return a[Math.floor(rnd()*a.length)]; };
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); };
  var toastEl = $('#toast'), tt;
  function toast(m){ toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(tt); tt = setTimeout(function(){ toastEl.classList.remove('on'); }, 2200); }

  var AVA = ['ava/maks.svg','ava/olena.svg','ava/ninja.svg','ava/dmytro.svg','ava/lucky.svg'];
  var NICKS = ['RiverRat','Maks777','Olena_K','NinjaTilt','LuckyAce','Dmytro.V','AceOfKyiv','Kateryna','BluffKing','ShortStack','Nutz','Vova_88','CheckRaise','PocketJ','TurboTom','Mila.S','Kirill_K','GTO_Bro','SuitedConn','DonkLead','Yarik','IceVeins','Sasha.P','Pavlo99'];
  var COLORS = ['#2F6FD6','#0B8F7A','#B4553A','#6A4FC9','#A3307A','#C08A2B','#2B8FB8'];
  var MARK = '<svg viewBox="0 0 276 100" style="width:64%;color:#fff"><use href="#mark12x"/></svg>';

  /* ── Data ────────────────────────── */
  var LEVELS = [
    {k:'micro', name:'Micro', stakes:[[.01,.02],[.02,.05],[.05,.10]]},
    {k:'low',   name:'Low',   stakes:[[.10,.25],[.25,.50],[.50,1]]},
    {k:'mid',   name:'Mid',   stakes:[[1,2],[2,4]]},
    {k:'high',  name:'High',  stakes:[[5,10],[10,20]]}
  ];
  function makeSeats(bb){
    var n = Math.max(0, Math.min(6, Math.round(rnd()*6.6)));
    var idx = [0,1,2,3,4,5].sort(function(){ return rnd()-.5; }).slice(0,n);
    var seats = [];
    for (var i=0;i<6;i++){
      if (idx.indexOf(i) < 0) { seats.push(null); continue; }
      var useImg = rnd() > .45;
      seats.push({ nm: pick(NICKS), img: useImg ? pick(AVA) : null, col: pick(COLORS), stk: bb * (20 + rnd()*180), mvp: rnd() > .88 });
    }
    return seats;
  }
  var TABLES = {};
  function genTables(){
    LEVELS.forEach(function(L){
      var list = [];
      L.stakes.forEach(function(s){
        var n = L.k === 'high' ? 2 : 3;
        for (var i=0;i<n;i++) list.push({ id: 1000 + Math.floor(rnd()*9000), sb:s[0], bb:s[1], seats: makeSeats(s[1]), jp: Math.round(s[1]*(300+rnd()*2400)) });
      });
      TABLES[L.k] = list;
    });
  }
  genTables();

  var TOURS = [
    {in:  70,  name:'$500 Deep Turbo',        kind:'TOURNAMENT', gtd:500,   bi:3.5, reg:4,   art:'jackpot', cls:''},
    {in:  190, name:'$1.5K Mystery Bounty',   kind:'BOUNTY',     gtd:1500,  bi:11,  reg:5,   art:'sunday', cls:'gold'},
    {in:  10,  name:'12xBet $66 Freeroll',    kind:'FREEROLL',   gtd:66,    bi:0,   reg:694, art:'king', cls:'free'},
    {in:  130, name:'Step 1 · $33 Final Ticket', kind:'SATELLITE', gtd:45, bi:3.3, reg:15,  art:'jackpot', cls:''},
    {in:  360, name:'Evening Major',          kind:'TOURNAMENT', gtd:20000, bi:55,  reg:198, art:'sunday', cls:'gold'},
    {in:  45,  name:'Hourly Hyper',           kind:'HYPER',      gtd:1000,  bi:5.5, reg:84,  art:'spin', cls:''},
    {in:  3140,name:'Sunday Main Event',      kind:'MAJOR',      gtd:50000, bi:109, reg:427, art:'sunday', cls:'gold'},
    {in:  240, name:'12xBet Bounty Hunter',   kind:'BOUNTY',     gtd:5000,  bi:11,  reg:241, art:'jackpot', cls:''}
  ];
  var SPINS = [
    {bi:.25, top:5000, cls:'t1', pl:1}, {bi:1, top:50000, cls:'t1', pl:0}, {bi:5, top:500000, cls:'t2', pl:3},
    {bi:10, top:500000, cls:'t2', pl:0}, {bi:50, top:500000, cls:'t3', pl:0}, {bi:100, top:500000, cls:'t3', pl:2}
  ];
  var t0 = Date.now();

  /* ── Pieces ──────────────────────── */
  var ART = {
    king:    {src:'brand/12bet/king.webp', pos:'62% 12%'},
    jackpot: {src:'brand/12bet/king.webp', pos:'100% 92%'},
    spin:    {src:'brand/12bet/king.webp', pos:'0% 55%'},
    sunday:  {src:'brand/12bet/king.webp', pos:'88% 28%'}
  };
  function artImg(k){ var a = ART[k] || ART.king; return '<img src="' + a.src + '" alt="" style="--pos:' + a.pos + '" loading="lazy"/>'; }
  function cdText(min){
    var s = Math.max(0, Math.round(min*60 - (Date.now()-t0)/1000));
    var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
    var p = function(v){ return String(v).padStart(2,'0'); };
    return d ? d + 'd ' + p(h) + ':' + p(m) : p(h) + ' : ' + p(m) + ' : ' + p(x);
  }
  function tourCard(t, i){
    return '<a class="tcard" href="#tours" data-tour="' + i + '"><div class="tart ' + t.cls + '">' +
      '<span class="kind">' + t.kind + '</span>' +
      '<span class="cd' + (t.in < 15 ? ' live' : '') + '">' + (t.in < 15 ? 'Late reg' : 'Starts in') + '<b class="num" data-cd="' + t.in + '">' + cdText(t.in) + '</b></span>' +
      artImg(t.art) +
      '<span class="gtd"><small>Prize pool</small><b class="num">' + usd(t.gtd) + '</b></span></div>' +
      '<div class="tbody"><h3>' + esc(t.name) + '</h3>' +
      '<div class="kv"><svg><use href="#i-cup"/></svg>Prize pool<span class="v g num">' + usd(t.gtd) + '</span></div>' +
      '<div class="kv"><svg><use href="#i-coin"/></svg>Buy-in: <span class="num" style="color:var(--text)">' + (t.bi ? usd(t.bi) : 'Free') + '</span><span class="v num" style="display:flex;align-items:center;gap:6px"><svg style="width:14px;height:14px"><use href="#i-user"/></svg>' + t.reg + '</span></div>' +
      '</div></a>';
  }
  function avatar(s){
    if (s.img) return '<span class="av"><img src="' + s.img + '" alt=""/></span>';
    return '<span class="av" style="background:' + s.col + '">' + esc(s.nm.slice(0,2).toUpperCase()) + '</span>';
  }
  function miniTable(t){
    var filled = t.seats.filter(Boolean).length;
    var cls = filled >= 6 ? 'full' : filled ? 'part' : '';
    var seats = t.seats.map(function(s, i){
      if (!s) return '<div class="seat empty s' + i + '"><span class="nm">Empty</span><span class="av">+</span></div>';
      return '<div class="seat s' + i + '"><span class="nm">' + esc(s.nm) + '</span>' + avatar(s) + (s.mvp ? '<span class="mvp">MVP</span>' : '') + '<span class="stk num">' + usd(Math.round(s.stk*100)/100) + '</span></div>';
    }).join('');
    return '<div class="mt" data-join role="link" tabindex="0" aria-label="NLH ' + t.id + ', blinds ' + usd(t.sb) + ' / ' + usd(t.bb) + ', ' + filled + ' of 6 seated">' +
      '<div class="oval"></div>' +
      '<span class="cnt ' + cls + ' num">' + filled + '/6</span>' +
      '<span class="jpb num"><svg><use href="#i-cup"/></svg>JP ' + fmt(t.jp) + '</span>' +
      '<span class="shield" title="Fair play"><svg><use href="#i-shield"/></svg></span>' +
      '<div class="ctr"><b class="num">NLH ' + t.id + '</b><small>Blinds</small><strong class="num">' + usd(t.sb) + ' / ' + usd(t.bb) + '</strong></div>' +
      seats + '</div>';
  }
  function listRow(t){
    var filled = t.seats.filter(Boolean).length;
    var cls = filled >= 6 ? 'full' : filled ? 'part' : '';
    return '<div class="lr"><span class="cnt ' + cls + ' num">' + filled + '/6</span><b class="num">NLH ' + t.id + '</b><b class="num">' + usd(t.sb) + ' / ' + usd(t.bb) + '</b><span class="m num h1">Buy-in ' + usd(t.bb*40) + ' – ' + usd(t.bb*100) + '</span><span class="jp num h2">JP ' + fmt(t.jp) + '</span><a class="btn ' + (filled >= 6 ? 'btn-dark' : 'btn-blue') + '" href="play.html" data-join>' + (filled >= 6 ? 'Waitlist' : 'Join') + '</a></div>';
  }
  /* ── Views ───────────────────────── */
  var main = $('#main');
  var state = { level:'micro', hideFull:false, hideEmpty:false, mode:'carousel', spinTab:'list' };
  var BANNERS = [
    {img:'brand/12bet/banner-jackpot.webp', href:'#holdem', alt:'Bad Beat Jackpot. Every player gets paid.'},
    {img:'brand/12bet/banner-spin.webp', href:'#spin', alt:'Spin & Go up to 1,000x'},
    {img:'brand/12bet/banner-sunday.webp', href:'#tours', alt:'Sunday Main $50,000 GTD'}
  ];

  function vHome(){
    return '<div class="view">' +
      '<div class="car"><button class="car-arrow l" type="button" aria-label="Previous"><svg class="i"><use href="#i-l"/></svg></button><div class="car-track">' +
        BANNERS.map(function(b){ return '<a class="slide" href="' + b.href + '"><img src="' + b.img + '" alt="' + esc(b.alt) + '"/></a>'; }).join('') +
      '</div><button class="car-arrow r" type="button" aria-label="Next"><svg class="i"><use href="#i-r"/></svg></button></div>' +
      '<div class="dots" id="dots"></div>' +
      '<div class="sec-h"><h2>Tournaments</h2><div class="sp"></div><a class="btn btn-dark" href="#tours">View all<svg class="i" style="width:16px;height:16px"><use href="#i-r"/></svg></a></div>' +
      '<div class="tgrid">' + TOURS.slice(0,4).map(tourCard).join('') + '</div>' +
      '<div class="sec-h"><h2>Texas Hold\'em</h2><div class="sp"></div><a class="btn btn-dark" href="#holdem">View all<svg class="i" style="width:16px;height:16px"><use href="#i-r"/></svg></a></div>' +
      '<div class="tables">' + TABLES.low.concat(TABLES.micro).slice(0,6).map(miniTable).join('') + '</div>' +
      '<div class="sec-h"><h2>Spin &amp; Go</h2><div class="sp"></div><a class="btn btn-dark" href="#spin">View all<svg class="i" style="width:16px;height:16px"><use href="#i-r"/></svg></a></div>' +
      '<div class="sgrid">' + SPINS.slice(0,3).map(spinCard).join('') + '</div>' +
    '</div>';
  }
  function levelBlock(L){
    var list = TABLES[L.k].filter(function(t){ var f=t.seats.filter(Boolean).length; return !(state.hideFull && f>=6) && !(state.hideEmpty && f===0); });
    var players = TABLES[L.k].reduce(function(a,t){ return a + t.seats.filter(Boolean).length; },0);
    var lo = L.stakes[0], hi = L.stakes[L.stakes.length-1];
    var body = state.mode === 'list' ? '<div class="tlist">' + list.map(listRow).join('') + '</div>'
      : '<div class="tables' + (state.mode === 'grid' ? ' grid' : '') + '" data-lv="' + L.k + '">' + list.map(miniTable).join('') + '</div>';
    if (!list.length) body = '<div class="notice">No tables match these filters.</div>';
    return '<section class="stake" id="lv-' + L.k + '"><div class="stake-h"><h3>' + L.name + '</h3>' +
      '<span class="meta"><svg><use href="#i-coin"/></svg><span class="bl">Blinds:</span> <b class="num">' + usd(lo[0]) + ' / ' + usd(lo[1]) + ' ~ ' + usd(hi[0]) + ' / ' + usd(hi[1]) + '</b><i></i><svg><use href="#i-cards"/></svg><b class="num">' + TABLES[L.k].length + '</b><i></i><svg><use href="#i-user"/></svg><b class="num">' + players + '</b></span>' +
      '<div class="sp"></div><span class="nav" style="display:flex;gap:8px;align-items:center">' +
      '<a class="btn btn-dark va" href="#" data-viewall="' + L.k + '">View all<svg class="i" style="width:16px;height:16px"><use href="#i-r"/></svg></a>' +
      '<button class="ibtn" type="button" data-scroll="-1" data-lv="' + L.k + '" aria-label="Previous"><svg class="i"><use href="#i-l"/></svg></button>' +
      '<button class="ibtn" type="button" data-scroll="1" data-lv="' + L.k + '" aria-label="Next"><svg class="i"><use href="#i-r"/></svg></button>' +
      '<button class="ibtn rf" type="button" data-refresh="' + L.k + '" aria-label="Refresh"><svg class="i"><use href="#i-refresh"/></svg></button>' +
      '<a class="btn btn-blue" href="play.html" data-join>Join</a></span></div>' + body + '</section>';
  }
  function vHoldem(){
    var order = LEVELS.slice(); var i = order.findIndex(function(L){ return L.k === state.level; });
    order = order.slice(i).concat(order.slice(0,i));
    return '<div class="view">' +
      '<div class="notice"><svg class="i"><use href="#i-bell"/></svg><span id="ntext"></span></div>' +
      '<div class="jstrip"><img src="brand/12bet/king.webp" alt=""/><span class="t"><small>NLH Bad Beat Jackpot</small><b class="num" id="jpv">$248,965</b></span></div>' +
      '<div class="frow"><div class="tabs" id="lvtabs">' + LEVELS.map(function(L){ return '<button type="button" data-lvtab="' + L.k + '"' + (L.k === state.level ? ' class="on"' : '') + '>' + L.name + '</button>'; }).join('') + '</div>' +
      '<div class="sp"></div>' +
      '<label class="chk"><input type="checkbox" id="hf"' + (state.hideFull ? ' checked' : '') + '/><span>Hide full<span class="lg"> tables</span></span></label>' +
      '<label class="chk"><input type="checkbox" id="he"' + (state.hideEmpty ? ' checked' : '') + '/><span>Hide empty<span class="lg"> tables</span></span></label>' +
      '<div class="vt"><button type="button" data-mode="grid"' + (state.mode !== 'list' ? ' class="on"' : '') + ' aria-label="Cards"><svg class="i"><use href="#i-grid"/></svg></button><button type="button" data-mode="list"' + (state.mode === 'list' ? ' class="on"' : '') + ' aria-label="List"><svg class="i"><use href="#i-list"/></svg></button></div></div>' +
      order.map(levelBlock).join('') +
    '</div>';
  }
  function spinCard(s){
    return '<a class="scard ' + s.cls + '" href="play.html" data-join><img src="brand/12bet/king.webp" alt="" loading="lazy" style="--pos:' + ({t1:'100% 92%',t2:'70% 10%',t3:'0% 50%'})[s.cls] + '"/>' +
      '<span class="bi"><small>Buy-in</small><b class="num">' + usd(s.bi) + '</b></span>' +
      '<span class="win"><small>WIN UP TO</small><b class="num">' + usd(s.top) + '</b></span>' +
      '<span class="ft"><span>3-Max</span>|<span style="display:flex;align-items:center;gap:4px"><svg style="width:13px;height:13px"><use href="#i-user"/></svg><span class="num">' + s.pl + '</span></span></span></a>';
  }
  function vSpin(){
    var body = state.spinTab === 'list' ? '<div class="sgrid">' + SPINS.map(spinCard).join('') + '</div>'
      : '<div class="notice" style="height:120px">You have no active Spin &amp; Go games. Pick a buy-in to start one.</div>';
    return '<div class="view"><div class="notice"><svg class="i"><use href="#i-bell"/></svg><span id="ntext"></span></div>' +
      '<div class="sbox"><div class="sec-h"><h2>Spin &amp; Go</h2><a href="#" data-soon="Spin & Go rules">How it works</a></div>' +
      '<div class="subtabs" id="spintabs"><button type="button" data-st="list"' + (state.spinTab==='list'?' class="on"':'') + '>Game list</button><button type="button" data-st="mine"' + (state.spinTab==='mine'?' class="on"':'') + '>My games</button></div>' +
      body + '</div></div>';
  }
  function vTours(){
    return '<div class="view"><div class="notice"><svg class="i"><use href="#i-bell"/></svg><span id="ntext"></span></div>' +
      '<div class="car"><div class="car-track"><a class="slide" href="#tours"><img src="brand/12bet/banner-sunday.webp" alt="Sunday Main $50,000 GTD"/></a><a class="slide" href="#holdem"><img src="brand/12bet/banner-jackpot.webp" alt="Bad Beat Jackpot"/></a></div></div>' +
      '<div class="sec-h"><h2>All tournaments</h2></div>' +
      '<div class="tgrid all">' + TOURS.map(tourCard).join('') + '</div></div>';
  }
  var VIEWS = { home:vHome, holdem:vHoldem, spin:vSpin, tours:vTours };

  /* ── Router ──────────────────────── */
  function route(){
    var v = (location.hash || '#home').slice(1).split('/')[0];
    if (!VIEWS[v]) v = 'home';
    main.innerHTML = VIEWS[v]();
    document.querySelectorAll('[data-v]').forEach(function(a){ a.classList.toggle('on', a.dataset.v === v); });
    document.body.classList.remove('drawer');
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    setupCarousel(); startNotice();
  }
  window.addEventListener('hashchange', route);

  /* Carousel */
  var carTimer;
  function setupCarousel(){
    clearInterval(carTimer);
    var track = $('.car-track', main), dots = $('#dots', main); if (!track) return;
    var n = track.children.length;
    if (dots) { dots.innerHTML = Array.from({length:n}).map(function(_,i){ return '<i data-i="' + i + '"' + (i===0?' class="on"':'') + '></i>'; }).join(''); }
    var go = function(i){ var s = track.children[(i+n)%n]; track.scrollTo({left: s.offsetLeft - track.offsetLeft, behavior:'smooth'}); };
    var cur = function(){ var w = track.children[0].getBoundingClientRect().width + 16; return Math.round(track.scrollLeft / w); };
    track.addEventListener('scroll', function(){ if (!dots) return; var c = cur(); dots.querySelectorAll('i').forEach(function(d,i){ d.classList.toggle('on', i===c); }); }, {passive:true});
    var l = $('.car-arrow.l', main), r = $('.car-arrow.r', main);
    if (l) l.onclick = function(){ go(cur()-1); };
    if (r) r.onclick = function(){ var c = cur(); go(track.scrollLeft + track.clientWidth >= track.scrollWidth - 4 ? 0 : c+1); };
    if (dots) dots.onclick = function(e){ var d = e.target.closest('i'); if (d) go(+d.dataset.i); };
    carTimer = setInterval(function(){ if (document.hidden) return; var c = cur(); go(track.scrollLeft + track.clientWidth >= track.scrollWidth - 4 ? 0 : c+1); }, 5500);
  }

  /* Live notice line */
  var HANDS = ['Straight Flush','Four of a Kind','Royal Flush','Full House'];
  var noticeTimer;
  function noticeText(){
    var L = pick(LEVELS), s = pick(L.stakes);
    return '<strong>' + esc(pick(NICKS)) + '</strong> hit <em>' + pick(HANDS) + '</em> at <em class="num">' + usd(s[0]) + '/' + usd(s[1]) + ' NLH ' + (1000 + Math.floor(rnd()*9000)) + '</em>';
  }
  function startNotice(){
    clearInterval(noticeTimer);
    var el = $('#ntext', main); if (!el) return;
    el.innerHTML = noticeText();
    noticeTimer = setInterval(function(){ var e = $('#ntext', main); if (!e) return; e.classList.add('out'); setTimeout(function(){ e.innerHTML = noticeText(); e.classList.remove('out'); }, 350); }, 4200);
  }
  /* jackpot + countdowns */
  var jp = 248965.3;
  setInterval(function(){
    jp += .2 + rnd()*2.8; var j = $('#jpv'); if (j) j.textContent = '$' + fmt(Math.floor(jp));
    document.querySelectorAll('[data-cd]').forEach(function(b){ b.textContent = cdText(+b.dataset.cd); });
  }, 1000);

  /* ── Events ──────────────────────── */
  document.addEventListener('click', function(e){
    var t;
    if ((t = e.target.closest('[data-soon]'))) { e.preventDefault(); haptic(); toast(t.dataset.soon + ' is coming soon'); return; }
    if ((t = e.target.closest('#burger'))) { document.body.classList.toggle('drawer'); haptic(); return; }
    if (e.target.closest('#drawerbg')) { document.body.classList.remove('drawer'); return; }
    if ((t = e.target.closest('.mt[data-join]'))) { haptic('medium'); location.href = 'play.html'; return; }
    if (e.target.closest('[data-join]')) { haptic('medium'); return; }
    if ((t = e.target.closest('[data-lvtab]'))) { state.level = t.dataset.lvtab; haptic(); route(); return; }
    if ((t = e.target.closest('[data-mode]'))) { state.mode = t.dataset.mode === 'list' ? 'list' : 'carousel'; haptic(); route(); return; }
    if ((t = e.target.closest('[data-viewall]'))) { e.preventDefault(); state.mode = state.mode === 'grid' ? 'carousel' : 'grid'; haptic(); route(); return; }
    if ((t = e.target.closest('[data-scroll]'))) { var tr = $('.tables[data-lv="' + t.dataset.lv + '"]', main); if (tr) tr.scrollBy({left: +t.dataset.scroll * (tr.clientWidth * .66), behavior:'smooth'}); return; }
    if ((t = e.target.closest('[data-refresh]'))) {
      var k = t.dataset.refresh; TABLES[k].forEach(function(x){ x.seats = makeSeats(x.bb); });
      var sec = $('#lv-' + k, main); if (sec) sec.outerHTML = levelBlock(LEVELS.find(function(L){ return L.k === k; }));
      haptic(); toast('Tables updated'); return;
    }
    if ((t = e.target.closest('[data-st]'))) { state.spinTab = t.dataset.st; haptic(); route(); return; }
    if ((t = e.target.closest('[data-tour]'))) { e.preventDefault(); haptic(); var x = TOURS[+t.dataset.tour]; toast('Registered for ' + x.name); return; }
  });
  document.addEventListener('change', function(e){
    if (e.target.id === 'hf') { state.hideFull = e.target.checked; route(); }
    if (e.target.id === 'he') { state.hideEmpty = e.target.checked; route(); }
  });
  document.addEventListener('keydown', function(e){ if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('mt')) { e.preventDefault(); location.href = 'play.html'; } });

  route();
})();
</script>
</body>
</html>
