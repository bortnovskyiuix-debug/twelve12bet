<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400" viewBox="0 0 300 400" version="1.1"><title>1XBET — Diamonds</title><desc>Simple card back designed for small UI display. One large canonical 1X mark, quiet coarse pattern, no fine text or lines. Fully editable vector.</desc><defs><pattern id="pattern" width="60" height="80" patternUnits="userSpaceOnUse"><path d="M30 5 L53 35 L30 65 L7 35 Z" fill="#1C78B6" /></pattern></defs><rect width="300" height="400" fill="#0A2340" /><rect id="pattern-field" width="300" height="400" fill="url(#pattern)" opacity=".42" /><g id="center-1X" transform="translate(55 150.942623) scale(0.7786885246) translate(-464 -239)" fill="#FFFFFF"><path d="M505 239 H546 L505 365 H465 L491 287 L464 309 L468 276 Z M547 239 H595 C606 239 615 243 623 250 L584 290 Z M505 365 L655 239 H708 L645 292 L676 365 H636 C620 365 611 357 603 342 L598 331 L561 365 Z" /></g></svg>